[project]
name = "meeting-prep-operonx"
version = "0.1.0"
description = "The meeting-prep assistant, built on OperonX"
requires-python = ">=3.12"
dependencies = [
    "operonx[openai]>=1.16.0",
    "operonx-agents[mcp]>=0.1.2",  # the research agent, MCPClient (operonx.agents)
    "meeting-prep-world",
]

[tool.uv]
package = false
index-url = "https://pypi.org/simple"

[tool.uv.sources]
meeting-prep-world = { path = "../meeting-prep-world", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
