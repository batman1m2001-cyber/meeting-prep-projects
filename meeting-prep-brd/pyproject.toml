[project]
name = "meeting-prep-brd"
version = "0.1.0"
description = "The meeting-prep assistant as the course brief designs it: seven agents, each an LLM with its own MCP tools"
requires-python = ">=3.12"
dependencies = [
    "operonx[openai]>=1.12.1",
    "meeting-prep-world",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
index-url = "https://pypi.org/simple"

[tool.uv.sources]
meeting-prep-world = { path = "../meeting-prep-world", editable = true }

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
