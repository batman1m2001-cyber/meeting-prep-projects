# The meeting-prep assistant's world: six fictional companies.
# Everything here is invented — no real firm, person or news item.
# One file feeds the database (CRM, calendar, knowledge base), the mock web
# (each company's site and news) and the mock search engine.

today: "2026-10-05"          # the demo's "this morning" (a Monday)
us:
  name: "Northwind AI"       # the company receiving the leads
  domain: "northwind-ai.example"
  sales: "sales@northwind-ai.example"

companies:
  - id: lotus
    name: "Lotus Logistics"
    domain: "lotus-logistics.example"
    industry: "Logistics & warehousing"
    hq: "Hai Phong, Vietnam"
    size: "about 1,200 staff, 9 warehouses"
    about: >-
      Lotus Logistics runs bonded warehouses and trucking between Hai Phong port and the
      northern industrial parks. It handles customs paperwork for about 300 importers.
    products: ["bonded warehousing", "customs brokerage", "cold-chain trucking"]
    people:
      - {name: "Linh Tran", title: "Chief Operating Officer", email: "linh.tran@lotus-logistics.example"}
      - {name: "Bao Do", title: "IT Manager", email: "bao.do@lotus-logistics.example"}
    news:
      - {date: "2026-09-22", title: "Lotus Logistics opens a cold-chain hub in Binh Duong",
         body: "The 20,000 m2 hub adds refrigerated storage for food and pharma exporters."}
      - {date: "2026-09-10", title: "Lotus pilots document scanning for customs declarations",
         body: "A three-month pilot digitises paper declarations; the COO wants it automated end to end."}
      - {date: "2026-06-02", title: "Lotus Logistics wins a five-year port services contract",
         body: "The contract covers container handling at two Hai Phong terminals."}
    crm: []                  # a new lead
    meetings:
      - {starts_at: "2026-10-07 10:00", title: "Intro call: document AI", attendees: ["Linh Tran"]}

  - id: saigonfresh
    name: "Saigon Fresh Foods"
    domain: "saigonfresh.example"
    industry: "Packaged foods"
    hq: "Ho Chi Minh City, Vietnam"
    size: "about 3,000 staff, 2 factories"
    about: >-
      Saigon Fresh Foods makes chilled ready meals and sauces for supermarkets in Vietnam
      and exports to Japan.
    products: ["chilled ready meals", "sauces", "private-label production"]
    people:
      - {name: "Minh Pham", title: "Head of IT", email: "minh.pham@saigonfresh.example"}
      - {name: "Thu Le", title: "Customer Service Director", email: "thu.le@saigonfresh.example"}
    news:
      - {date: "2026-09-28", title: "Saigon Fresh Foods expands exports to Japan",
         body: "A new line in the Long An factory doubles output for Japanese retailers."}
      - {date: "2026-08-15", title: "Saigon Fresh Foods reports 18% revenue growth",
         body: "Growth came mostly from export and private-label orders."}
    crm:                     # a known customer
      - {date: "2025-11-12", kind: "pilot", note: "Customer-service chatbot pilot for order questions. Good accuracy; paused in Jan 2026 for budget."}
      - {date: "2026-03-04", kind: "call", note: "Minh Pham asked to revisit after the export expansion. Main pain: supplier invoices typed by hand."}
    meetings:
      - {starts_at: "2026-10-09 14:00", title: "Follow-up: invoice automation", attendees: ["Minh Pham", "Thu Le"]}

  - id: halong
    name: "Halong Robotics"
