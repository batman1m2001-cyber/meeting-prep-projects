    products: ["shelf-moving robots", "fleet management software"]
    people:
      - {name: "Emily Vo", title: "CTO and co-founder", email: "emily.vo@halongrobotics.example"}
    news:
      - {date: "2026-09-30", title: "Halong Robotics raises a $12M Series A",
         body: "The round will fund a factory in Bac Ninh and a team in Singapore."}
      - {date: "2026-07-18", title: "Halong Robotics robots go live at a major e-commerce warehouse",
         body: "Forty robots now move shelves for a top online retailer's Hanoi warehouse."}
